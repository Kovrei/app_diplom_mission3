name: Deploy Nginx to Kubernetes

on:
  push:
    branches: [ main ]  # Триггер на push в ветку main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.USER_DOCKER_HUB }}
        password: ${{ secrets.MY_TOKEN_DOCKER_HUB }}

    - name: Extract metadata (tags, labels)
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: your-docker-hub/nginx-app
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=sha

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Set up kubectl
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
        chmod 600 ~/.kube/config

    - name: Deploy to Kubernetes
      env:
        IMAGE_TAG: ${{ steps.meta.outputs.tags[0] }}
      run: |
        # Обновляем тег образа в манифесте
        sed -i "s|your-docker-hub/nginx-app:.*|$IMAGE_TAG|g" kubernetes/deployment.yaml
        kubectl apply -f kubernetes/deployment.yaml
        # Ждём готовности подов
        kubectl rollout status deployment/nginx-app
